[package]
name = "app"
version = "0.1.29"
description = "Boarderless MCP Desktop Control Panel Launcher"
authors = ["CrackenReleased <contact@crackenreleased.com>"]
license = "Proprietary"
repository = "https://github.com/CrackenReleased/boarderless.app_MCP"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-log = "2"
arboard = "3.4.0"
sysinfo = "0.30.0"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
