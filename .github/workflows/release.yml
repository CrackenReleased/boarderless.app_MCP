name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag and signing configuration
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Run this workflow on a matching version tag, not a branch." }
          if (-not $env:SIGNING_KEY) { throw "Configure TAURI_SIGNING_PRIVATE_KEY before publishing signed updates." }

      - name: Run MCP regression suite
        run: npm test

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Boarderless MCP ${{ github.ref_name }}'
          releaseBody: 'Automatic build of Boarderless MCP server desktop bridge with system tray notification updates and process lifecycle optimizations.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

  publish-winget:
    if: vars.WINGET_REGISTERED == 'true'
    needs: build
    runs-on: windows-latest
    steps:
      - name: Publish to Windows Package Manager (Winget)
        uses: vedantmgoyal2009/winget-releaser@v2
        with:
          release-tag: ${{ github.ref_name }}
          identifier: CrackenReleased.BoarderlessMCP
          token: ${{ secrets.WINGET_PAT }}

